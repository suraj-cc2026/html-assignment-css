<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Registration Form</title>
</head>
<body>
	<h1>Student Registration</h1>
	<form action="#" method="post">
		<p>
			<label for="name">Atul:</label>
			<input type="text" id="name" name="name" required>
		</p>
		<p>
			<label for="email">atulkumar750074@gmail.com:</label>
			<input type="email" id="email" name="email" required>
		</p>
		<p>
			<label for="password">Password:</label>
			<input type="password" id="password" name="password" required>
		</p>
		<p>
			<label for="birthdate">15/09/2006:</label>
			<input type="date" id="birthdate" name="birthdate">
		</p>
		<p>
			<label for="phone">+91:</label>
			<input type="tel" id="phone" name="phone">
		</p>
		<p>
			<label for="course">BCA AI:</label>
			<input type="text" id="course" name="course" required>
		</p>
		<p>
			<input type="checkbox" id="confirm" name="confirm" required>
			<label for="confirm">I confirm the information is accurate.</label>
		</p>
		<button type="submit">Register</button>
		<button type="reset">Clear form</button>
	</form>
</body>
</html>
